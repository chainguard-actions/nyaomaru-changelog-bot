name: Test provider and dry-run-json-report inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run changelog-bot with provider and dry-run-json-report inputs
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          provider: 'openai'
          dry-run-json-report: 'true'
          require-provider: 'false'
          fail-on-llm-error: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error (provider, dry-run-json-report inputs exercised)"
          echo "PASS"
