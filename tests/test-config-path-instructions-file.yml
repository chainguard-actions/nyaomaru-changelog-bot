name: Test config-path and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config and instructions files
        run: |
          mkdir -p /tmp/changelog-bot-test
          echo '{}' > /tmp/changelog-bot-test/changelog-bot.json
          echo 'Group commits by type.' > /tmp/changelog-bot-test/instructions.txt
      - id: action
        uses: .
        with:
          config-path: /tmp/changelog-bot-test/changelog-bot.json
          instructions-file: /tmp/changelog-bot-test/instructions.txt
          dry-run: "true"
          no-ai: "true"
        continue-on-error: true
      - name: Assert action ran (dry-run with config-path and instructions-file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config-path and instructions-file inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
