name: Test path inputs (changelog-path, base-branch, config-path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal config file and changelog file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-test"
          echo '{}' > "$GITHUB_WORKSPACE/tmp-test/changelog-bot.json"
          echo '# Changelog' > "$GITHUB_WORKSPACE/tmp-test/CHANGELOG.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          changelog-path: tmp-test/CHANGELOG.md
          config-path: tmp-test/changelog-bot.json
          base-branch: act-harness
          dry-run: 'true'
          no-ai: 'true'

      - name: Assert action ran (dry-run with path inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm resolution issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
