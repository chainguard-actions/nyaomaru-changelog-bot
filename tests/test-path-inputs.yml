name: Test path inputs (changelog-path, config-path, base-branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run changelog-bot with path inputs in dry-run no-ai mode
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          changelog-path: 'CHANGELOG.md'
          config-path: '${{ github.workspace }}/hardened/tests/fixtures/changelog-bot-config.json'
          base-branch: 'main'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error (changelog-path, config-path, base-branch inputs exercised)"
          echo "PASS"
