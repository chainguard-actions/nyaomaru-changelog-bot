name: Test path inputs (changelog-path, config-path, base-branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture files
        run: |
          echo "# Changelog" > /tmp/test-changelog.md
          echo '{}' > /tmp/test-config.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          changelog-path: /tmp/test-changelog.md
          config-path: /tmp/test-config.json
          base-branch: main
          dry-run: 'true'
          no-ai: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (path inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm package issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
