name: Test path inputs (changelog-path, config-path, base-branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixture files
        run: |
          mkdir -p /tmp/changelog-bot-test
          echo '{}' > /tmp/changelog-bot-test/changelog-bot.json
          echo '# Changelog' > /tmp/changelog-bot-test/CHANGELOG.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          changelog-path: /tmp/changelog-bot-test/CHANGELOG.md
          config-path: /tmp/changelog-bot-test/changelog-bot.json
          base-branch: main
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action ran (dry-run with path inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
