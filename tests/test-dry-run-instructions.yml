name: Test dry-run with instructions and instructions-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create instructions file
        run: |
          echo "Group changes by type. Use concise language." > /tmp/changelog-instructions.txt

      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          instructions: 'Group changes by type.'
          instructions-file: '/tmp/changelog-instructions.txt'
        continue-on-error: true

      - name: Assert action ran (dry-run with instructions and instructions-file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
