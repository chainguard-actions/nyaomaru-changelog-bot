name: Test dry-run with instructions and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config user.name "Test User"
          git config user.email "test@example.com"
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          instructions: 'Group by feature and bugfix.'
          instructions-file: '${{ github.workspace }}/hardened/tests/fixtures/instructions.txt'
      - name: Assert action ran (dry-run with instructions and instructions-file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode with instructions inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
