name: Test dry-run with instructions and dry-run-json-report inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          instructions: 'Group changes by type and use concise language.'
          dry-run-json-report: 'true'
        continue-on-error: true
      - name: Assert action ran (dry-run with instructions and json report)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with instructions and dry-run-json-report inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
