name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a changelog-bot config file
        run: |
          mkdir -p /tmp/changelog-config
          cat > /tmp/changelog-config/changelog-bot.json <<'EOF'
          {
            "changelogPath": "CHANGELOG.md",
            "baseBranch": "act-harness"
          }
          EOF

      - name: Run changelog-bot with config-path
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.0-test'
          config-path: '/tmp/changelog-config/changelog-bot.json'

      - name: Assert action ran (dry-run with config-path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config-path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
