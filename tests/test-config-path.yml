name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal CHANGELOG.md and config file for the test
        run: |
          cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to this project will be documented in this file.
          EOF
          cat > /tmp/changelog-bot-config.json <<'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          changelog-path: 'CHANGELOG.md'
          release-tag: 'HEAD'
          release-name: '0.0.1-test'
          config-path: '/tmp/changelog-bot-config.json'
      - name: Assert action ran with config-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on the npm package behavior,
          # but it must have run (not skipped) and accepted the config-path input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config-path input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
