name: Test instructions and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run changelog-bot with instructions in dry-run mode
        id: action-instructions
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          instructions: 'Group changes by type and use concise language.'

      - name: Assert instructions step completed successfully
        run: |
          echo "Action completed without error (instructions input accepted)"
          echo "PASS"

      - name: Run changelog-bot with instructions-file in dry-run mode
        id: action-instructions-file
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          instructions-file: '${{ github.workspace }}/hardened/tests/fixtures/instructions.txt'

      - name: Assert instructions-file step completed successfully
        run: |
          echo "Action completed without error (instructions-file input accepted)"
          echo "PASS"
