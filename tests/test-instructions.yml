name: Test instructions inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          instructions: 'Group changes by type and use concise language.'
          instructions-file: '${{ github.workspace }}/hardened/tests/fixtures/instructions.txt'
          no-ai: 'true'
          dry-run: 'true'
          release-tag: HEAD
      - name: Assert action ran (instructions/instructions-file inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with instructions/instructions-file inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
