name: Test dry-run with custom changelog path and release metadata
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a custom changelog file
        run: |
          echo "# Changelog" > /tmp/CUSTOM_CHANGELOG.md
          echo "" >> /tmp/CUSTOM_CHANGELOG.md
          echo "## [Unreleased]" >> /tmp/CUSTOM_CHANGELOG.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '2.0.0'
          release-body: 'Initial test release'
          changelog-path: '/tmp/CUSTOM_CHANGELOG.md'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with custom changelog path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom changelog path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
