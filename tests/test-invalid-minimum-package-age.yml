name: Test invalid minimum-package-age-days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare changelog
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.changelog-test"
          printf '# Changelog\n\n## [1.0.0] - 2024-01-01\n\n- Initial release\n' > "$GITHUB_WORKSPACE/.changelog-test/CHANGELOG.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          minimum-package-age-days: 'abc'
          changelog-path: .changelog-test/CHANGELOG.md
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid minimum-package-age-days"
            exit 1
          fi
          echo "PASS"
