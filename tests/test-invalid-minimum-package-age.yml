name: Test invalid minimum-package-age-days fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record state before
        run: sha256sum tests/fixtures/CHANGELOG.md | tee /tmp/before.sha
      - id: action
        uses: .
        continue-on-error: true
        with:
          changelog-path: tests/fixtures/CHANGELOG.md
          minimum-package-age-days: 'abc'
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid minimum-package-age-days"
            exit 1
          fi
          echo "PASS"
      - name: Assert changelog untouched
        run: |
          if ! sha256sum -c /tmp/before.sha; then
            echo "FAIL: changelog modified"
            exit 1
          fi
          echo "PASS"
