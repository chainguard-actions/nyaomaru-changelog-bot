name: Test WHY inputs (why, why-engine, why-max-prs, why-max-chars-per-pr, why-confidence, why-label)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          why: 'true'
          why-engine: jev
          why-max-prs: '5'
          why-max-chars-per-pr: '1000'
          why-confidence: low
          why-label: 'WHY'
          dry-run: 'true'
          no-ai: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (why inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with why inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm package issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
