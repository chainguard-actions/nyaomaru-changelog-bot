name: Test zero minimum-package-age-days (valid value)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for changelog-bot
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          minimum-package-age-days: '0'

      - name: Assert action did not fail on validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With minimum-package-age-days=0 (valid), the action should pass validation
          # and proceed. It may still fail due to sentinel repo, but NOT due to validation.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with minimum-package-age-days=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after passing validation (sentinel repo or npm network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
