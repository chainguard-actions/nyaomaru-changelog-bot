name: Test language and instructions inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity (required by action)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with language, instructions, and release-body inputs
        id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          language: 'English'
          instructions: 'Group changes by type.'
          release-body: 'Initial release notes.'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error with language, instructions, and release-body inputs"
