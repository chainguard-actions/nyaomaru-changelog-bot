name: Test language, instructions, config-path, and base-branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal config file
        run: |
          mkdir -p /tmp/changelog-config
          echo '{}' > /tmp/changelog-config/changelog-bot.json
      - name: Create instructions file
        run: |
          echo "Group changes by type." > /tmp/changelog-instructions.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          language: 'en'
          instructions: 'Keep entries concise.'
          instructions-file: '/tmp/changelog-instructions.txt'
          config-path: '/tmp/changelog-config/changelog-bot.json'
          base-branch: 'main'
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with language/instructions/config-path/base-branch inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
