name: Test valid minimum-package-age-days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity (required by action)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with minimum-package-age-days set to 0 (disabled)
        id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          minimum-package-age-days: '0'
          release-tag: 'HEAD'
          release-name: '0.0.0-test'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed successfully with age-days=0
        run: |
          echo "PASS: action completed without error with minimum-package-age-days=0"
