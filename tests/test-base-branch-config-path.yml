name: Test base-branch and config-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-branch: main
          config-path: hardened/tests/fixtures/changelog-bot-config.json
          dry-run: 'true'
          no-ai: 'true'
          release-tag: HEAD
      - name: Assert action ran (dry-run with base-branch and config-path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or missing npm package)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
