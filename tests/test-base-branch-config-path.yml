name: Test base-branch and config-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-config"
          cat > "$GITHUB_WORKSPACE/tmp-config/changelog-bot.json" <<'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          base-branch: 'main'
          config-path: 'tmp-config/changelog-bot.json'
      - name: Assert action ran (dry-run with base-branch and config-path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with base-branch and config-path inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
