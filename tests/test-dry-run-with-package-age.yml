name: Test dry-run with explicit minimum-package-age-days=0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run changelog-bot with minimum-package-age-days=0 in dry-run + no-ai mode
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.1-test'
          minimum-package-age-days: '0'
          npm-version: 'latest'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error with minimum-package-age-days=0"
          echo "PASS"
