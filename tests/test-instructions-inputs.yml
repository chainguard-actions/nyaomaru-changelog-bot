name: Test instructions, instructions-file, base-branch, and config-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for changelog-bot
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create instructions file and config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-test-inputs"
          echo "Group changes by type. Be concise." > "$GITHUB_WORKSPACE/tmp-test-inputs/instructions.txt"
          cat > "$GITHUB_WORKSPACE/tmp-test-inputs/changelog-bot.json" <<'EOF'
          {
            "changelogPath": "CHANGELOG.md"
          }
          EOF

      - name: Run changelog-bot with instructions, instructions-file, base-branch, config-path
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.0-test'
          instructions: 'Keep entries brief and clear.'
          instructions-file: 'tmp-test-inputs/instructions.txt'
          base-branch: 'act-harness'
          config-path: 'tmp-test-inputs/changelog-bot.json'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error with instructions, instructions-file, base-branch, and config-path inputs"
