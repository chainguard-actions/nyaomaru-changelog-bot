name: Test instructions inputs (instructions, instructions-file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-test"
          echo 'Group changes by component. Be concise.' > "$GITHUB_WORKSPACE/tmp-test/instructions.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          instructions: 'Group changes by type and be concise.'
          instructions-file: tmp-test/instructions.txt
          dry-run: 'true'
          no-ai: 'true'

      - name: Assert action ran (dry-run with instructions inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with instructions inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm resolution issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
