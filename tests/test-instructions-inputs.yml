name: Test instructions inputs (instructions, instructions-file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create instructions file
        run: |
          echo "Group changes by type." > "$GITHUB_WORKSPACE/instructions.txt"
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          instructions: 'Be concise and clear.'
          instructions-file: 'instructions.txt'
          dry-run: 'true'
      - name: Assert step completed
        run: |
          echo "PASS: action ran with instructions and instructions-file inputs"
