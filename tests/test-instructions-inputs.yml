name: Test instructions inputs (instructions, instructions-file, dry-run-json-report)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create instructions fixture file
        run: |
          echo "Group all bug fixes under a single 'Bug Fixes' heading." > /tmp/test-instructions.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          instructions: 'Keep entries concise and clear.'
          instructions-file: /tmp/test-instructions.txt
          dry-run: 'true'
          dry-run-json-report: 'true'
          no-ai: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (instructions inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with instructions inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm package issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
