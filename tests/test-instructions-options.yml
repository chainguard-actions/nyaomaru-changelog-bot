name: Test instructions and config options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy config file and instructions file
        run: |
          mkdir -p /tmp/changelog-bot-test
          echo '{}' > /tmp/changelog-bot-test/config.json
          echo 'Group fixes under Bug Fixes.' > /tmp/changelog-bot-test/instructions.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          config-path: '/tmp/changelog-bot-test/config.json'
          instructions: 'Group all commits by type.'
          instructions-file: '/tmp/changelog-bot-test/instructions.txt'
          release-body: 'This release includes bug fixes and improvements.'
          fail-on-llm-error: 'false'

      - name: Assert action ran (dry-run with instructions options)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode with instructions options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
