name: Test dry-run with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run changelog-bot with custom options
        id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0'
          language: 'English'
          changelog-path: 'CHANGELOG.md'
          minimum-package-age-days: '0'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with custom options without error"
          echo "PASS"
