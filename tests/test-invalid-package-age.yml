name: Test invalid minimum-package-age-days validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run changelog-bot with invalid minimum-package-age-days
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          minimum-package-age-days: 'not-a-number'

      - name: Assert action failed with validation error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid minimum-package-age-days, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid minimum-package-age-days"
