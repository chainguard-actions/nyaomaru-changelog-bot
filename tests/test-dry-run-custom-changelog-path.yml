name: Test dry-run with custom changelog path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create a custom changelog file path
        run: |
          mkdir -p /tmp/changelog-test
          touch /tmp/changelog-test/MY_CHANGELOG.md

      - name: Run changelog-bot with custom changelog path in dry-run + no-ai mode
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.1-test'
          changelog-path: '/tmp/changelog-test/MY_CHANGELOG.md'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error using custom changelog path"
          echo "PASS"
