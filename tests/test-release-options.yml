name: Test release and branch options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-body: 'This release includes bug fixes and improvements.'
          base-branch: 'main'
          config-path: '${{ github.workspace }}/hardened/tests/fixtures/changelog-bot-config.json'
          no-ai: 'true'
          dry-run: 'true'
          release-tag: HEAD
      - name: Assert action ran (release-body/base-branch/config-path inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with release-body/base-branch/config-path inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
