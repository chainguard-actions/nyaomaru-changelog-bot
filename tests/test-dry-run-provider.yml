name: Test dry-run with provider input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with provider specified but no-ai to skip actual LLM calls
        uses: .
        with:
          provider: openai
          no-ai: 'true'
          dry-run: 'true'
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with provider input set"
