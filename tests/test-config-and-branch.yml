name: Test config-path, base-branch, dry-run-json-report, and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity (required by action)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create instructions file for test
        run: |
          echo "Group changes by feature area." > /tmp/test-instructions.txt

      - name: Create config file for test
        run: |
          echo '{}' > /tmp/test-config.json

      - name: Run action with config-path, base-branch, dry-run-json-report, and instructions-file inputs
        id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          base-branch: 'main'
          config-path: '/tmp/test-config.json'
          dry-run-json-report: 'true'
          instructions-file: '/tmp/test-instructions.txt'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error with config-path, base-branch, dry-run-json-report, and instructions-file inputs"
