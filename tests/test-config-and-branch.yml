name: Test config-path, base-branch, fail-on-llm-error, require-provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal config file
        run: |
          cat > /tmp/changelog-bot-config.json <<'EOF'
          {}
          EOF
      - name: Create a minimal instructions file
        run: |
          echo "Group commits by type." > /tmp/changelog-instructions.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          config-path: /tmp/changelog-bot-config.json
          base-branch: main
          fail-on-llm-error: 'false'
          require-provider: 'false'
          no-ai: 'true'
          dry-run: 'true'
      - name: Assert action ran (dry-run with config-path and base-branch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config-path and base-branch"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
