name: Test dry-run with config-path and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - name: Create config and instructions fixture files
        run: |
          mkdir -p /tmp/changelog-bot-fixtures
          cat > /tmp/changelog-bot-fixtures/changelog-bot.json <<'EOF'
          {
            "changelogPath": "CHANGELOG.md",
            "baseBranch": "main"
          }
          EOF
          cat > /tmp/changelog-bot-fixtures/instructions.txt <<'EOF'
          Group changes by type: Features, Bug Fixes, and Other.
          EOF
      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          config-path: '/tmp/changelog-bot-fixtures/changelog-bot.json'
          instructions-file: '/tmp/changelog-bot-fixtures/instructions.txt'
        continue-on-error: true
      - name: Assert action ran (dry-run with config-path and instructions-file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config-path and instructions-file inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
