name: Test language and instructions inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create instructions file
        run: |
          echo "Group all changes by type." > /tmp/instructions.txt

      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          language: 'en'
          instructions: 'Keep entries concise.'
          instructions-file: '/tmp/instructions.txt'
        continue-on-error: true

      - name: Assert action ran (dry-run with language and instructions)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with language and instructions inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
