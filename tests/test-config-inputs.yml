name: Test config-path, changelog-path, base-branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixture changelog file
        run: |
          echo "# Changelog" > "$GITHUB_WORKSPACE/MYCHANGELOG.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config-path: ${{ github.workspace }}/hardened/tests/fixtures/changelog-bot.json
          changelog-path: MYCHANGELOG.md
          base-branch: main
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action ran (config-path, changelog-path, base-branch inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config-path, changelog-path, base-branch inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
