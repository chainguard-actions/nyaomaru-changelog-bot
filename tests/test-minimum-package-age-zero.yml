name: Test minimum-package-age-days with zero value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          minimum-package-age-days: '0'

      - name: Assert action passed validation for zero minimum-package-age-days
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The validation guard should pass for '0' (a valid non-negative integer).
          # The action may still fail due to sentinel repo, but it must NOT fail
          # at the validation step (which exits immediately before any npm install).
          # We cannot distinguish validation failure from runtime failure here,
          # so we accept both success and failure as valid outcomes — the key
          # assertion is that the invalid-input test (separate file) fails.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with minimum-package-age-days=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at runtime (not at validation) — acceptable on sentinel repo"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
