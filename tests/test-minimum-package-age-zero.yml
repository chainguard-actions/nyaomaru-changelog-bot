name: Test minimum-package-age-days with zero value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.1-test'
          minimum-package-age-days: '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action did not fail due to minimum-package-age-days validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The validation for minimum-package-age-days=0 should pass (it's a valid integer).
          # The action may still fail for other reasons (sentinel repo, npm network), but
          # it must NOT fail with "Invalid minimum-package-age-days value".
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with minimum-package-age-days=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed for a reason other than validation (sentinel repo or npm)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
