name: Test dry-run with config-path, instructions-file, dry-run-json-report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - name: Create config and instructions files
        run: |
          mkdir -p /tmp/changelog-bot-test
          cat > /tmp/changelog-bot-test/config.json <<'EOF'
          {}
          EOF
          cat > /tmp/changelog-bot-test/instructions.txt <<'EOF'
          Group commits by type.
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          dry-run-json-report: 'true'
          config-path: '/tmp/changelog-bot-test/config.json'
          instructions-file: '/tmp/changelog-bot-test/instructions.txt'
      - name: Assert action ran (dry-run with config-path, instructions-file, dry-run-json-report)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
