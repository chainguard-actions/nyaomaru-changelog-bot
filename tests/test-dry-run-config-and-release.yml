name: Test dry-run with config-path, instructions-file, release-body, and dry-run-json-report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          dry-run-json-report: 'true'
          config-path: 'hardened/tests/fixtures/changelog-bot.json'
          instructions-file: 'hardened/tests/fixtures/instructions.txt'
          release-body: 'This release includes bug fixes and improvements.'
      - name: Assert action ran (dry-run with config-path, instructions-file, release-body, dry-run-json-report)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config-path, instructions-file, release-body, and dry-run-json-report inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
