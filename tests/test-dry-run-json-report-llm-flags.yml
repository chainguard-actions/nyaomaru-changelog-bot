name: Test dry-run-json-report, fail-on-llm-error, and require-provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: "true"
          dry-run-json-report: "true"
          fail-on-llm-error: "false"
          require-provider: "false"
          no-ai: "true"
        continue-on-error: true
      - name: Assert action ran (dry-run-json-report, fail-on-llm-error, require-provider)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with dry-run-json-report, fail-on-llm-error, and require-provider inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
