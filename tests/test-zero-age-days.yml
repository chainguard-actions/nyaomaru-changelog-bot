name: Test zero minimum-package-age-days (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run changelog-bot with explicit zero minimum-package-age-days
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          release-tag: 'HEAD'
          release-name: '0.0.0-test'
          minimum-package-age-days: '0'

      - name: Assert action succeeded with zero age days
        run: |
          echo "PASS: action completed successfully with minimum-package-age-days=0"
