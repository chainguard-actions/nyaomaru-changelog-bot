name: Test dry-run with why, why-max-prs, why-max-chars-per-pr, why-confidence, why-label
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with why-related inputs
        uses: .
        with:
          why: 'true'
          why-max-prs: '5'
          why-max-chars-per-pr: '2000'
          why-confidence: 'medium'
          why-label: 'Why'
          no-ai: 'true'
          dry-run: 'true'
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with why, why-max-prs, why-max-chars-per-pr, why-confidence, why-label inputs"
