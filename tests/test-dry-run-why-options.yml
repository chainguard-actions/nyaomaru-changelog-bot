name: Test dry-run with WHY options (why disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record state before
        run: |
          sha256sum tests/fixtures/CHANGELOG.md | tee /tmp/before.sha
          git rev-parse HEAD > /tmp/before-head
      - id: action
        uses: .
        with:
          changelog-path: tests/fixtures/CHANGELOG.md
          release-tag: HEAD
          release-name: 9.9.7
          dry-run: 'true'
          no-ai: 'true'
          why: 'false'
          why-engine: jev
          why-max-prs: '5'
          why-max-chars-per-pr: '1000'
          why-confidence: medium
          why-label: Why
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert dry-run did not modify changelog or HEAD
        run: |
          if ! sha256sum -c /tmp/before.sha; then
            echo "FAIL: changelog was modified during dry-run"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(cat /tmp/before-head)" ]; then
            echo "FAIL: HEAD changed during dry-run"
            exit 1
          fi
          echo "PASS"
