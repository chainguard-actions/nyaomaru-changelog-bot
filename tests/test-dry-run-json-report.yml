name: Test dry-run JSON report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare changelog
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.changelog-test"
          printf '# Changelog\n\n## [1.0.0] - 2024-01-01\n\n- Initial release\n' > "$GITHUB_WORKSPACE/.changelog-test/CHANGELOG.md"
          sha256sum "$GITHUB_WORKSPACE/.changelog-test/CHANGELOG.md" | awk '{print $1}' > /tmp/changelog-before.sha
      - id: action
        uses: .
        with:
          changelog-path: .changelog-test/CHANGELOG.md
          release-name: '2.0.0'
          release-body: 'Added a JSON report scenario'
          minimum-package-age-days: '00'
          dry-run: 'true'
          dry-run-json-report: 'true'
          no-ai: 'true'
          language: 'English'
      - name: Assert action succeeded and changelog untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          BEFORE="$(cat /tmp/changelog-before.sha)"
          AFTER="$(sha256sum "$GITHUB_WORKSPACE/.changelog-test/CHANGELOG.md" | awk '{print $1}')"
          echo "before: $BEFORE"
          echo "after:  $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: dry-run modified the changelog file"
            exit 1
          fi
          echo "PASS"
