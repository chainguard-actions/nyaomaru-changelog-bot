name: Test dry-run with language and instructions inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git for test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          language: 'en'
          instructions: 'Group by feature and bugfix'
          release-body: 'This release includes important fixes.'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action completed
        run: |
          echo "PASS: action completed with language, instructions, and release-body inputs"
