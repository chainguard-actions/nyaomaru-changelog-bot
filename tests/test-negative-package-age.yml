name: Test negative minimum-package-age-days fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          minimum-package-age-days: '-1'
        continue-on-error: true
      - name: Assert action failed with negative package age
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The regex ^[0-9]+$ does not match negative numbers (they start with '-')
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with negative minimum-package-age-days, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected negative minimum-package-age-days value"
