name: Test dry-run with extra inputs (language, instructions, release-body, base-branch, fail-on-llm-error, require-provider)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker (if needed)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          base-branch: 'main'
          language: 'en'
          instructions: 'Group by feature and bugfix'
          release-body: 'This release includes important fixes'
          fail-on-llm-error: 'false'
          require-provider: 'false'
        continue-on-error: true
      - name: Assert action ran (dry-run with extra inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode with extra inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or npm install issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
