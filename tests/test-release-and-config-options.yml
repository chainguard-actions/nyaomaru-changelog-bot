name: Test release body, base branch, config path, and dry-run JSON report options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create minimal changelog-bot config file
        run: |
          cat > /tmp/changelog-bot-config.json <<'EOF'
          {}
          EOF

      - name: Run changelog-bot with release body, base branch, config path, and dry-run JSON report
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          release-body: 'This is a test release body with additional notes.'
          base-branch: 'act-harness'
          config-path: '/tmp/changelog-bot-config.json'
          dry-run-json-report: 'false'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with release-body, base-branch, config-path, and dry-run-json-report options"
