name: Test base-branch and provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal CHANGELOG.md for the test
        run: |
          cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to this project will be documented in this file.
          EOF
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          changelog-path: 'CHANGELOG.md'
          release-tag: 'HEAD'
          release-name: '0.0.1-test'
          base-branch: 'main'
          provider: 'openai'
      - name: Assert action ran with base-branch and provider inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In dry-run mode without a real API key, the action may fail when
          # provider is set (LLM call attempted). Both success and graceful
          # failure are acceptable outcomes — what matters is the inputs were
          # accepted and the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with base-branch and provider inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
