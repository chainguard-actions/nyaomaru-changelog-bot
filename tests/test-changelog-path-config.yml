name: Test changelog-path, config-path, and base-branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for changelog-bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          changelog-path: 'CHANGELOG.md'
          config-path: ''
          base-branch: 'main'
          release-name: '1.0.0'

      - name: Assert action ran with path and branch inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # dry-run + no-ai with changelog-path and base-branch should succeed or fail gracefully
          # (sentinel repo may cause GitHub API issues)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with changelog-path and base-branch inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or git history issue expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
