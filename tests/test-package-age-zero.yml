name: Test minimum-package-age-days zero (default valid value)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          minimum-package-age-days: '0'
          release-tag: 'HEAD'
          release-name: '1.0.0'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action did not fail on validation (age=0 is valid)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail due to validation — age=0 is a valid integer.
          # It may still fail due to sentinel repo or network issues, which is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with minimum-package-age-days=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (not a validation failure — sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
