name: Test LLM provider options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider: openai
          language: en
          fail-on-llm-error: 'false'
          require-provider: 'false'
          no-ai: 'true'
          dry-run: 'true'
          release-tag: HEAD
      - name: Assert action ran (provider/language/fail-on-llm-error/require-provider inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with provider/language/fail-on-llm-error/require-provider inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
