name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create instructions file
        run: |
          echo "Group changes by type. Highlight breaking changes prominently." > /tmp/changelog-instructions.txt
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          release-tag: HEAD
          release-name: '0.0.1'
          instructions-file: '/tmp/changelog-instructions.txt'
          npm-version: 'latest'
          minimum-package-age-days: '0'
      - name: Assert action completed with instructions-file
        run: |
          echo "PASS: action completed with instructions-file input"
