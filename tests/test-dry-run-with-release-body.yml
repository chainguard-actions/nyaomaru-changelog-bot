name: Test dry-run with release body and custom changelog path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for changelog-bot
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a temporary changelog file path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-changelog"
          echo "# Changelog" > "$GITHUB_WORKSPACE/tmp-changelog/CHANGELOG.md"

      - name: Run changelog-bot with release body in dry-run + no-ai mode
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          release-body: 'Test release notes for CI validation'
          changelog-path: 'tmp-changelog/CHANGELOG.md'
          language: 'en'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error with release body and custom changelog path"
