name: Test dry-run with config-path, base-branch, and release-body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create config file and instructions file
        run: |
          mkdir -p /tmp/changelog-config
          echo '{}' > /tmp/changelog-config/changelog-bot.json

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          config-path: '/tmp/changelog-config/changelog-bot.json'
          base-branch: 'main'
          release-body: 'This is a test release body for coverage.'

      - name: Assert action ran with config-path, base-branch, and release-body
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with config-path, base-branch, and release-body"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
