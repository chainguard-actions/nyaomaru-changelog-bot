name: Test dry-run with config-path, base-branch, and dry-run-json-report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a minimal changelog-bot config file
        run: |
          cat > /tmp/changelog-bot-config.json <<'EOF'
          {
            "changelogPath": "CHANGELOG.md"
          }
          EOF

      - name: Run changelog-bot with config-path, base-branch, and dry-run-json-report
        id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          release-tag: 'HEAD'
          release-name: '1.0.0-test'
          config-path: '/tmp/changelog-bot-config.json'
          base-branch: 'act-harness'
          dry-run-json-report: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error using config-path, base-branch, and dry-run-json-report"
          echo "PASS"
