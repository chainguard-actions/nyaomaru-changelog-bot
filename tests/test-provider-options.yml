name: Test provider and branch options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          no-ai: 'true'
          base-branch: 'main'
          language: 'en'
          provider: 'openai'
          fail-on-llm-error: 'false'
          require-provider: 'false'
          config-path: ''
      - name: Assert action ran (dry-run with provider options)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with provider options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or missing API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
