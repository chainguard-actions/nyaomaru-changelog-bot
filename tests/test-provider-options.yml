name: Test provider and LLM error handling inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          dry-run: 'true'
          no-ai: 'true'
          provider: 'openai'
          fail-on-llm-error: 'false'
          require-provider: 'false'
        continue-on-error: true

      - name: Assert action ran (dry-run with provider options)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with provider options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
